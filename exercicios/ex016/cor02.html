<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <!--Configuração global da CSS */-->
    <style>
        * { /* CONFIGURAÇÃO GLOBAL DAS CSS */
            height: 100%;
        }
        body {
            background-image: linear-gradient(to bottom, #FC02D8, #FC02D8, #810AFA, #FFBF02, #FE0C58); 
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
