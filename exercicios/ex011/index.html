<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Dinâmicas</title>
</head>
<body>
    <h1>A mídias em html podem ser dinâmicas para ajduar o usuário a ter uma interaritividade melhor com o site</h1>
    <h2>agora vamos para as imagens dinâmicas</h2>
  <!--a Ordem importa! Coloco a maior imagem primeiro como referência na função img src e depois vou colocando em cima as imagens por ordem de tamanho.-->
    <picture>
        <source media="(max-width: 495px)" srcset="imagens/Pequeno.png" type="image/png"> 
        <source media="(max-width: 701px)" srcset="imagens/Media.png" type="image/png">        
        <img src="imagens/Grande.png" alt="imagem flexível">        
    </picture>
    <h1>Agora vamos repodruzir um aúdio no site</h1>
    <audio preload="metadata" controls loop>
    <source src="audio/naquela-mesa.mp3" type="audio/mpeg">
    </audio>
    <p><a href="audio/naquela-mesa.mp3">Clique aqui </a>para baixar o arquivo mp3.</p>

</body>
</html>
