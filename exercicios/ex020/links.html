<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-element
        > = children
        */
        
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none; /*retiro o sublinhado dos links*/
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: black;
            text-decoration: underline; /*fica sublinhado quando passo por cima*/
        }

        a:active {
            color: yellow;
        }

        a::after {
            content: '  [LINK]';
            text-decoration: none;
            font-weight: normal;
            color: darkblue;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/LMPerote" target="_blank">Repositrótio GITHUB</a></li>
        <li><a href="https://www.youtube.com/@matheusxd826" target="_blank">Canal do YOUTUBE</a></li>
        <li><a href="https://www.ba.gov.br/seplan/" target="_blank">Site da seplan</a></li>
    </ul>
</body>
</html>
