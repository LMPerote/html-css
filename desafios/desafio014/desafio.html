<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 550px;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td{
            border: 1px solid black;
            padding: 8px 10px;
            text-align: center;
        }

        thead th {
            background-color: #808080;
            color: #fff;
        }
       
        tbody th {
            background-color: #fff;
            color: #000;
        }

        /* linhas de média: a linha toda em cinza */
        tr.media th, tr.media td {
            background-color: #808080;
            color: #fff;
        }

        tr.media th {
            text-align: left;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>9,5</td>
                <td>6,5</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Fìsica</td>
                <td>7,5</td>
                <td>6,8</td>
                <td>7,2</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>8,5</td>
                <td>9,4</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>6,8</td>
                <td>7,4</td>
                <td>7,1</td>
            </tr>
            <tr class="media">
                <th colspan="4">Média de Exatas</th>
                <td>7,8</td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td>9,8</td>
                <td>10</td>
                <td>9,9</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>8,4</td>
                <td>7,8</td>
                <td>8,1</td>
            </tr>
            <tr class="media">
                <th colspan="4"> Média de Humanas</th>
                <td>9</td>
            </tr>
        </tbody>
        <tfoot>

        </tfoot>
    </table>
</body>
</html>
